<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokedole 2.0</title>
    <link rel="preconnect" href="https://pokeapi.co" />
    <link rel="preconnect" href="https://api.pokemontcg.io" />
    <link rel="preconnect" href="https://images.pokemontcg.io" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="play-surface" aria-labelledby="game-title">
        <header class="topbar">
          <div>
            <p class="eyebrow">All-generation Pokemon guessing game</p>
            <h1 id="game-title">Pokedole 2.0</h1>
          </div>
          <button id="changeSettingsBtn" class="mode-button settings-button" type="button" hidden>Settings</button>
        </header>

        <section id="setupScreen" class="setup-screen">
          <div class="setup-panel">
            <div>
              <p class="eyebrow">Setup</p>
              <h2>Choose Your Run</h2>
            </div>

            <div class="setup-group">
              <h3>Round Type</h3>
              <div class="top-actions" aria-label="Round type">
                <button id="dailyBtn" class="mode-button active" type="button">Daily</button>
                <button id="randomBtn" class="mode-button" type="button">Random</button>
              </div>
            </div>

            <div class="setup-group">
              <h3>Generations</h3>
              <div class="filters" id="generationFilters" aria-label="Generation filters"></div>
            </div>

            <div class="setup-actions">
              <button id="startGameBtn" class="start-button" type="button">Start Game</button>
              <p id="setupStatus" class="setup-status" role="status">Building the Pokedex...</p>
            </div>
          </div>
        </section>

        <section id="gameScreen" class="game-screen" hidden>
          <nav class="challenge-tabs" aria-label="Game modes">
            <button class="challenge-button active" type="button" data-challenge="attributes">Attributes</button>
            <button class="challenge-button" type="button" data-challenge="card">Card Blur</button>
            <button class="challenge-button" type="button" data-challenge="entry">Dex Entry</button>
            <button class="challenge-button" type="button" data-challenge="silhouette">Silhouette</button>
          </nav>

          <section class="game-grid">
            <aside class="clue-panel" aria-label="Mystery clue">
              <div class="score-strip">
                <span id="roundLabel">Daily</span>
                <strong id="guessCount">0 guesses</strong>
              </div>

              <div id="clueStage" class="clue-stage stage-attributes">
                <div id="loadingMark" class="loading-mark">?</div>
                <img id="pokemonImage" class="pokemon-art" alt="Mystery Pokemon clue" />
                <img id="cardImage" class="card-art" alt="Mystery Pokemon card" />
                <p id="entryText" class="entry-text"></p>
              </div>

              <p id="cluePrompt" class="clue-prompt">Building the Pokedex...</p>
              <p id="clueHint" class="clue-hint"></p>
              <div id="typeHints" class="type-hints" aria-live="polite"></div>
            </aside>

            <section class="guess-panel">
              <form id="guessForm" class="guess-form" autocomplete="off">
                <label for="guessInput">Guess a Pokemon</label>
                <div class="guess-row">
                  <input id="guessInput" name="guess" list="pokemonOptions" placeholder="Start typing a name" />
                  <button id="guessButton" type="submit">Guess</button>
                </div>
                <datalist id="pokemonOptions"></datalist>
              </form>

              <div id="status" class="status" role="status">Building the Pokedex...</div>

              <div id="attributeBoard" class="table-wrap">
                <table class="guess-table" aria-label="Attribute guesses">
                  <thead>
                    <tr>
                      <th>Pokemon</th>
                      <th>Type 1</th>
                      <th>Type 2</th>
                      <th>Gen</th>
                      <th>Habitat</th>
                      <th>Color</th>
                      <th>Stage</th>
                      <th>Height</th>
                      <th>Weight</th>
                    </tr>
                  </thead>
                  <tbody id="guessBody"></tbody>
                </table>
              </div>

              <div id="simpleBoard" class="simple-board" aria-label="Guesses"></div>

              <section id="resultsPanel" class="results-panel" aria-live="polite"></section>
            </section>
          </section>
        </section>
      </section>
    </main>

    <script src="./app.js" type="module"></script>
  </body>
</html>
